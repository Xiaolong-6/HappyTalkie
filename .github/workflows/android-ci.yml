name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache CI debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: happytalky-android-debug-keystore-v1

      - name: Ensure Android debug keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android 37 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test and build
        shell: bash
        run: gradle --no-daemon :core:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug

      - name: Render UI screenshot baselines
        shell: bash
        run: gradle --no-daemon :mobile:updateDebugScreenshotTest :wear:updateDebugScreenshotTest

      - name: Upload phone UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-phone-ui-screenshots
          path: mobile/src/screenshotTestDebug/reference
          if-no-files-found: error

      - name: Upload watch UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-watch-ui-screenshots
          path: wear/src/screenshotTestDebug/reference
          if-no-files-found: error

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-mobile-debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Prepare debug dist metadata
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="debug-pr-${{ github.event.pull_request.number }}"
          else
            TAG="debug-main"
          fi

          cat > debug-dist.json <<EOF
          {
            "tag": "$TAG",
            "commit": "${{ github.sha }}",
            "phone": "HappyTalky-phone-debug.apk",
            "watch": "HappyTalky-watch-debug.apk",
            "builtAt": "${{ github.event.repository.updated_at }}"
          }
          EOF
          echo "DIST_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish latest debug APK dist
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DIST_TAG" >/dev/null 2>&1; then
            gh release create "$DIST_TAG" \
              --prerelease \
              --title "HappyTalky $DIST_TAG" \
              --notes "Automatically updated debug build. Phone and Wear APKs are built from the same commit."
          fi

          gh release upload "$DIST_TAG" \
            "mobile/build/outputs/apk/debug/mobile-debug.apk#HappyTalky-phone-debug.apk" \
            "wear/build/outputs/apk/debug/wear-debug.apk#HappyTalky-watch-debug.apk" \
            "debug-dist.json#debug-dist.json" \
            --clobber
